name: Build Android APK

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --parallel --daemon

      - name: Collect APK
        run: |
          mkdir release
          find . -name "*.apk" -exec cp {} release/app-debug.apk \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: release/app-debug.apk

      - name: Send APK to Telegram
        run: |
          APK_PATH=$(find release -name "*.apk" | head -n 1)

          curl -v -F chat_id=1394443616 \
               -F document=@$APK_PATH \
               https://api.telegram.org/bot8680121283:AAEKE7VMpx2q9A01IE4UboRPbvB6sbuPk7Y/sendDocument
